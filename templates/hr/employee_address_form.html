{% extends "base.html" %}
{% block title %}{{ "Edit" if address else "Add" }} Address{% endblock %}
{% block content %}
<h1 class="h4 mb-1">{{ "Edit" if address else "Add" }} Address</h1>
<p class="text-muted mb-4">{{ employee.full_name }}</p>
<form method="post" class="card shadow-sm border-0" style="max-width: 560px;">
  <div class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-2 mb-3">
      <div class="col-8">
        <label class="form-label">Street</label>
        <input class="form-control" name="street" value="{{ (address.street | orblank) if address else '' }}">
      </div>
      <div class="col-4">
        <label class="form-label">Unit/Suite</label>
        <input class="form-control" name="unit" value="{{ (address.unit | orblank) if address else '' }}">
      </div>
    </div>
    {% include "_geography_fields.html" %}
    <div class="mb-3" style="max-width: 220px;">
      <label class="form-label">Postal code</label>
      <input class="form-control" name="postal_code" value="{{ (address.postal_code | orblank) if address else '' }}">
    </div>
  </div>
  <div class="card-footer bg-white d-flex gap-2 justify-content-end">
    <a href="{{ url_for('hr.view_employee', employee_id=employee.employee_id) }}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/geography_picker.js') }}"></script>
<script>
  initGeographyPicker({
    initial: {
      region_id: {{ (address.region_id if address else '') | tojson }},
      country_id: {{ (address.country_id if address else '') | tojson }},
      state_id: {{ (address.state_id if address else '') | tojson }},
      city_id: {{ (address.city_id if address else '') | tojson }}
    }
  });
</script>
{% endblock %}
