{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Change Password</h1>

<div class="card shadow-sm border-0" style="max-width: 520px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="current_password">Current password</label>
        <input class="form-control" id="current_password" name="current_password" type="password" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">New password</label>
        <input class="form-control" id="new_password" name="new_password" type="password" minlength="8" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirm_password">Confirm new password</label>
        <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" required>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Change password</button>
        <a href="{{ url_for('system_mgmt.index') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
<p class="text-muted small mt-3">
  Your existing encrypted data stays intact — nothing needs to be re-entered.
  Forgot your current password instead? <a href="{{ url_for('auth_bp.forgot_password') }}">Use your recovery phrase</a>.
</p>
{% endblock %}
