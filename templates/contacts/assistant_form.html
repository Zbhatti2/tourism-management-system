{% extends "base.html" %}
{% block title %}Add Contact{% endblock %}
{% block content %}
<h1 class="h4 mb-4">Add Contact</h1>
<p class="text-muted small">Just the basics for now — open this contact later to fill in the rest.</p>
<form method="post" class="card shadow-sm border-0" style="max-width: 480px;">
  <div class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="mb-3">
      <label class="form-label">Full name *</label>
      <input class="form-control" name="full_name" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input class="form-control" name="phone_number">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" name="email_address">
    </div>
  </div>
  <div class="card-footer bg-white d-flex gap-2 justify-content-end">
    <a href="{{ next_url }}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
