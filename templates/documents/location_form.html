{% extends "base.html" %}
{% block title %}Add Location{% endblock %}
{% block content %}
<h1 class="h4 mb-4">Add Location — {{ item.content_name }}</h1>
<form method="post" class="card shadow-sm border-0" style="max-width: 560px;" enctype="multipart/form-data">
  <div class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Type *</label>
      <select class="form-select" id="location_type" name="location_type" required onchange="toggleLocationType()">
        <option value="Stored in Database">Upload a file (stored in the database)</option>
        <option value="Cloud Link">Cloud Link (a web URL)</option>
      </select>
    </div>
    <div class="mb-3" id="upload_group">
      <label class="form-label" for="upload_file">File *</label>
      <input class="form-control" type="file" id="upload_file" name="upload_file">
      <div class="form-text">PDF, Word, image or any other file, up to 25 MB.</div>
    </div>
    <div class="mb-3" id="link_group">
      <label class="form-label" for="path_or_url">Link *</label>
      <input class="form-control" type="url" id="path_or_url" name="path_or_url" placeholder="https://…">
    </div>
  </div>
  <div class="card-footer bg-white d-flex gap-2 justify-content-end">
    <a href="{{ url_for('documents.view_content', content_id=item.content_id) }}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
  function toggleLocationType() {
    var isUpload = document.getElementById('location_type').value === 'Stored in Database';
    document.getElementById('upload_group').hidden = !isUpload;
    document.getElementById('link_group').hidden = isUpload;
    document.getElementById('upload_file').required = isUpload;
    document.getElementById('path_or_url').required = !isUpload;
  }
  toggleLocationType();
</script>
{% endblock %}
