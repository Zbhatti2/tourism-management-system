{# Shared header for the Website screens. Needs: title, preview (site url), s (settings) optional. #}
<div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
  <div>
    <div class="text-uppercase small text-muted fw-semibold">Website</div>
    <h1 class="h3 mb-0">{{ title }}</h1>
    {% if subtitle %}<div class="small text-muted">{{ subtitle }}</div>{% endif %}
  </div>
  {% if preview %}<a class="btn btn-outline-primary" href="{{ preview }}" target="_blank"><i class="bi bi-box-arrow-up-right"></i> View the website</a>{% endif %}
</div>
