{% extends "base.html" %}
{% block title %}{{ "Edit Phone" if phone else "Add Phone" }}{% endblock %}
{% block content %}
<h1 class="h4 mb-1">{{ "Edit Phone" if phone else "Add Phone" }}</h1>
<p class="text-muted mb-4">{{ org.organization_name }}</p>
<form method="post" class="card shadow-sm border-0" style="max-width: 480px;">
  <div class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Type</label>
      <select class="form-select" name="phone_type_id">
        <option value="">— None —</option>
        {% for t in phone_types %}
        <option value="{{ t.phone_type_id }}" {{ "selected" if phone and phone.phone_type_id == t.phone_type_id else "" }}>{{ t.label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-4">
        <label class="form-label">Country code</label>
        <input class="form-control" name="country_code" placeholder="+1" value="{{ (phone.country_code | orblank) if phone else '' }}">
      </div>
      <div class="col-4">
        <label class="form-label">Area code</label>
        <input class="form-control" id="area_code" name="area_code" value="{{ (phone.area_code | orblank) if phone else '' }}">
      </div>
      <div class="col-4">
        <label class="form-label">Extension</label>
        <input class="form-control" name="extension" value="{{ (phone.extension | orblank) if phone else '' }}">
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="no_area_code" onchange="toggleAreaCode()" {{ "checked" if phone and not phone.area_code else "" }}>
      <label class="form-check-label small" for="no_area_code">No area code — many countries (e.g. Pakistan) don't use one for mobile numbers</label>
    </div>
    <div class="mb-3">
      <label class="form-label">Number *</label>
      <input class="form-control" name="number" required value="{{ (phone.number | orblank) if phone else '' }}">
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="is_primary" name="is_primary" {{ "checked" if phone and phone.is_primary else "" }}>
      <label class="form-check-label" for="is_primary">Primary phone</label>
    </div>
  </div>
  <div class="card-footer bg-white d-flex gap-2 justify-content-end">
    <a href="{{ url_for('organizations.view_organization', org_id=org.organization_id) }}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
  function toggleAreaCode() {
    var checked = document.getElementById('no_area_code').checked;
    var field = document.getElementById('area_code');
    field.disabled = checked;
    if (checked) field.value = '';
  }
  toggleAreaCode();
</script>
{% endblock %}
