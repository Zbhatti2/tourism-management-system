{% extends "base.html" %}
{% block title %}{{ "Edit Email" if email else "Add Email" }}{% endblock %}
{% block content %}
<h1 class="h4 mb-1">{{ "Edit Email" if email else "Add Email" }}</h1>
<p class="text-muted mb-4">{{ org.organization_name }}</p>
<form method="post" class="card shadow-sm border-0" style="max-width: 480px;">
  <div class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Email address *</label>
      <input class="form-control" type="email" name="email_address" required value="{{ (email.email_address | orblank) if email else '' }}" autofocus>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="is_primary" name="is_primary" {{ "checked" if email and email.is_primary else "" }}>
      <label class="form-check-label" for="is_primary">Primary email</label>
    </div>
  </div>
  <div class="card-footer bg-white d-flex gap-2 justify-content-end">
    <a href="{{ url_for('organizations.view_organization', org_id=org.organization_id) }}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
