{% extends "base.html" %}
{% block title %}TMS System Admin — Edit Hub Type{% endblock %}
{% block content %}
<nav class="mb-2">
  <a href="{{ url_for('platform_lookups.index', table='hub_types') }}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Platform Lookups — Transport Hubs</a>
</nav>
<h1 class="h3 mb-4">Edit Hub Type</h1>
<form method="post" class="card shadow-sm border-0" style="max-width: 520px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card-body">
    <div class="mb-3"><label class="form-label">Code</label><input class="form-control" value="{{ row.code }}" disabled></div>
    <div class="mb-3"><label class="form-label" for="label">Label</label><input class="form-control" id="label" name="label" value="{{ row.label }}" required></div>
    <div class="mb-3"><label class="form-label" for="icon">Icon</label><input class="form-control" id="icon" name="icon" value="{{ row.icon or '' }}"></div>
    <div class="mb-3"><label class="form-label" for="sort_order">Sort order</label><input class="form-control" id="sort_order" name="sort_order" type="number" value="{{ row.sort_order }}" style="max-width: 140px;"></div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1" {{ 'checked' if row.is_active else '' }}>
      <label class="form-check-label" for="is_active">Active</label>
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
