{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block auth_content %}
<div class="pims-auth-wrap">
  <div class="card pims-auth-card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 mb-1">Tourism Management System</h1>
      <p class="text-muted mb-4">Sign in to your organization's workspace.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">User ID</label>
          <input class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100 mb-3" type="submit">Log in</button>
        <div class="text-center">
          <a href="{{ url_for('auth_bp.forgot_password') }}" class="small">Forgot your password?</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
