{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block auth_content %}
<div class="pims-auth-wrap">
  <div class="card pims-auth-card shadow-lg border-0" style="max-width: 500px;">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 mb-1">Reset your password</h1>
      <p class="text-muted mb-4">Enter your 12-word recovery phrase and choose a new password. Your existing encrypted data stays intact — nothing needs to be re-entered.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">User ID</label>
          <input class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="seed_phrase">Recovery phrase</label>
          <textarea class="form-control" id="seed_phrase" name="seed_phrase" rows="3" placeholder="word1 word2 word3 ..." required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">New password</label>
          <input class="form-control" id="password" name="password" type="password" minlength="8" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirm_password">Confirm new password</label>
          <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" required>
        </div>
        <button class="btn btn-primary w-100 mb-3" type="submit">Reset password</button>
        <div class="text-center">
          <a href="{{ url_for('auth_bp.login') }}" class="small">Back to login</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
