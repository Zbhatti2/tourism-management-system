{% extends "base.html" %}
{% block title %}Edit Intelligence Entry{% endblock %}
{% block content %}
<h1 class="h4 mb-1">Edit Intelligence Entry</h1>
<p class="text-muted mb-4">Originally entered by {{ entry.entered_by_name }}.</p>
<form method="post" class="card shadow-sm border-0" style="max-width: 640px;">
  <div class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3" style="max-width: 220px;">
      <label class="form-label">Date</label>
      <input class="form-control" type="date" name="entry_date" value="{{ entry.entry_date }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Note</label>
      <textarea class="form-control" name="note" rows="6" required>{{ entry.note }}</textarea>
    </div>
  </div>
  <div class="card-footer bg-white d-flex gap-2 justify-content-end">
    <a href="{{ url_for('intelligence.index') }}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
